[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "workspace-artifact-indexer"
version = "0.4.0"
description = "Small local helper for CI checkout context"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Workspace Tools" }]
dependencies = []

# Declared as an extra rather than [dependency-groups]: `pip install -e .`
# does not install dependency-groups, so `make test` would find no pytest.
[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
workspace-context-check = "workspace_artifact_indexer.bootstrap:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
